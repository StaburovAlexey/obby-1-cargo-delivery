# Include at nginx http{} scope. Replace hostname, certificate and web root.
map $http_upgrade $obby_connection_upgrade {
    default upgrade;
    '' close;
}
upstream obby_online {
    server 127.0.0.1:8081;
    keepalive 8;
}
server {
    listen 443 ssl;
    server_name game.example.com;
    ssl_certificate /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
    root /opt/obby-cargo-delivery/build;

    location = /ws {
        proxy_pass http://obby_online;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $obby_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 45s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass http://obby_online;
        proxy_set_header Host $host;
        access_log off;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
